name: Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run lint
      - run: npm run test

      # example project
      - run: npm pack
      - run: npm ci
        working-directory: example
      - run: npm install --no-save ../studyportals-cdk-cloudfront-auth-*.tgz
        working-directory: example
      - run: npm run test
        working-directory: example
