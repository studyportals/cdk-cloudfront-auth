name: Build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run lint
      - run: npm run test

      # example project
      - run: npm pack
      - run: npm ci
        working-directory: example
      - run: npm install --no-save ../studyportals-cdk-cloudfront-auth-*.tgz
        working-directory: example
      - run: npm run test
        working-directory: example

      - run: npm run semantic-release
        if: github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
